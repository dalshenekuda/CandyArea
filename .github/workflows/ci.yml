name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Override in repo secrets if build needs real storefront env (see README).
      SESSION_SECRET: ci-placeholder-session-secret-min-32-chars
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Workaround npm optional deps bug (https://github.com/npm/cli/issues/4828):
      # ensure Rollup's Linux binary is present so the Vite build can run.
      - name: Ensure Rollup native binary
        run: npm install @rollup/rollup-linux-x64-gnu --no-save

      - run: npm run lint
      - run: npm run build
